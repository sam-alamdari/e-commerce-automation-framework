name: E-Commerce Automation CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run smoke tests
        run: >
          mvn test
          "-Dsurefire.suiteXmlFiles=src/test/resources/suites/smoke-suite.xml"
          "-Dbrowser=chrome"
          "-Dheadless=true"
          "-DbaseUrl=https://www.demoblaze.com"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: |
            target/surefire-reports/
            target/allure-results/
            target/screenshots/
          if-no-files-found: ignore
